name: Patch InfernoFS

on: workflow_dispatch

jobs:
  patch:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Download pre-built patcher from release
        run: |
          mkdir -p patcher
          curl -fL -o patcher/inferno_fs_patcher.zip \
            https://github.com/kirill1984221321-gif/build/releases/download/1/inferno_fs_patcher.zip
          cd patcher
          unzip -o inferno_fs_patcher.zip
          file inferno_fs_patcher
          chmod +x inferno_fs_patcher

      - name: Install MEGAcmd from DMG
        run: |
          curl -fL -o /tmp/MEGAcmdSetup.dmg https://mega.nz/MEGAcmdSetup.dmg
          mkdir -p /tmp/MEGAcmd_app
          hdiutil attach /tmp/MEGAcmdSetup.dmg -nobrowse -mountpoint /tmp/megacmd_mnt
          cp -R /tmp/megacmd_mnt/MEGAcmd.app /tmp/MEGAcmd_app/
          hdiutil detach /tmp/megacmd_mnt
          echo "/tmp/MEGAcmd_app/MEGAcmd.app/Contents/MacOS" >> $GITHUB_PATH
          ls -lh /tmp/MEGAcmd_app/MEGAcmd.app/Contents/MacOS/
          test -x /tmp/MEGAcmd_app/MEGAcmd.app/Contents/MacOS/mega-login && echo "mega-login OK"
          test -x /tmp/MEGAcmd_app/MEGAcmd.app/Contents/MacOS/mega-get && echo "mega-get OK"
          test -x /tmp/MEGAcmd_app/MEGAcmd.app/Contents/MacOS/mega-put && echo "mega-put OK"
          test -x /tmp/MEGAcmd_app/MEGAcmd.app/Contents/MacOS/mega-cmd-server && echo "mega-cmd-server OK"

      - name: Download iphone-save from MEGA
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          MEGA_BIN=/tmp/MEGAcmd_app/MEGAcmd.app/Contents/MacOS
          "$MEGA_BIN/mega-cmd-server" &
          sleep 5
          "$MEGA_BIN/mega-login" "$MEGA_EMAIL" "$MEGA_PASSWORD"
          "$MEGA_BIN/mega-get" /iphone-save.tar.gz
          ls -lh iphone-save.tar.gz
          tar --sparse -xzf iphone-save.tar.gz
          ls -lh root

      - name: Mount APFS root
        run: |
          hdiutil attach -imagekey diskimage-class=CRawDiskImage -blocksize 4096 -noverify -noautofsck ./root
          diskutil list
          sudo diskutil enableownership /Volumes/System
          sudo mount -urw /Volumes/System
          ls /Volumes/System/System/Library/Caches/com.apple.dyld/

      - name: Patch dyld_shared_cache_arm64e
        run: |
          sudo ./patcher/inferno_fs_patcher \
            /Volumes/System/System/Library/Caches/com.apple.dyld/dyld_shared_cache_arm64e

      - name: Unmount and repack
        run: |
          sudo hdiutil detach /Volumes/System
          tar --sparse -czf /tmp/iphone-patched.tar.gz \
            root firmware syscfg ctrl_bits nvram sep_nvram effaceable panic_log root_ticket.der
          ls -lh /tmp/iphone-patched.tar.gz

      - name: Upload to MEGA
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          MEGA_BIN=/tmp/MEGAcmd_app/MEGAcmd.app/Contents/MacOS
          "$MEGA_BIN/mega-login" "$MEGA_EMAIL" "$MEGA_PASSWORD"
          "$MEGA_BIN/mega-put" /tmp/iphone-patched.tar.gz /iphone-patched.tar.gz
          "$MEGA_BIN/mega-ls" /
