name: Patch InfernoFS

on: workflow_dispatch

jobs:
  patch:
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Show environment
        run: |
          df -h
          pwd
          sw_vers

      - name: Download pre-built patcher from release
        run: |
          set -e
          mkdir -p patcher
          cd patcher

          for i in 1 2 3; do
            curl -fL --retry 3 --retry-delay 5 -o inferno_fs_patcher.zip \
              "https://github.com/kirill1984221321-gif/build/releases/download/1/inferno_fs_patcher.zip" && break
            echo "curl attempt $i failed, retry in 5s"
            sleep 5
          done

          unzip -o inferno_fs_patcher.zip
          echo "=== Extracted ==="
          ls -la

          PATCHER_BIN=$(find . -name inferno_fs_patcher -type f | head -1)
          if [ -z "$PATCHER_BIN" ]; then
            echo "ERROR: inferno_fs_patcher not found in archive"
            find . -type f
            exit 1
          fi
          echo "Found: $PATCHER_BIN"

          if [ "$PATCHER_BIN" != "./inferno_fs_patcher" ]; then
            cp -f "$PATCHER_BIN" ./inferno_fs_patcher
          fi

          chmod +x ./inferno_fs_patcher
          file ./inferno_fs_patcher || true
          ls -lh ./inferno_fs_patcher

      - name: Install megatools
        run: |
          set -e
          brew install megatools

      - name: Download iphone-save from MEGA public link
        run: |
          set -e
          mkdir -p /tmp/megadl
          cd /tmp/megadl

          MEGA_URL="https://mega.nz/file/TaBHyA6J#SiPWdjPBg9DJCl4m5mU3PKejB4Ot3-XXEVHRwDMAdBc"

          for i in 1 2 3; do
            echo "=== megadl attempt $i ==="
            if megadl "$MEGA_URL"; then
              break
            fi
            echo "megadl failed, retry in 15s"
            sleep 15
          done

          echo "=== Files after download ==="
          ls -lh

          if [ ! -f iphone-save.tar.gz ]; then
            FOUND=$(ls *.tar.gz 2>/dev/null | head -1)
            if [ -z "$FOUND" ]; then
              echo "ERROR: no .tar.gz after megadl"
              ls -la
              exit 1
            fi
            mv "$FOUND" iphone-save.tar.gz
          fi

          SIZE=$(stat -f%z iphone-save.tar.gz)
          echo "Archive size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000000 ]; then
            echo "ERROR: archive smaller than 1GB, corrupted"
            exit 1
          fi

          echo "=== Extracting archive (BSD tar, auto sparse) ==="
          tar -xzf iphone-save.tar.gz

          echo "=== Files after extract ==="
          ls -lh

          if [ ! -f root ]; then
            echo "ERROR: root not found after extraction"
            exit 1
          fi
          echo "root logical size: $(ls -lh root)"
          echo "root disk usage:  $(du -h root)"

      - name: Mount APFS root
        run: |
          set -e
          cd /tmp/megadl

          echo "=== Attaching raw image ==="
          hdiutil attach -imagekey diskimage-class=CRawDiskImage \
            -blocksize 4096 -noverify -noautofsck ./root

          echo "=== diskutil list ==="
          diskutil list

          echo "=== /Volumes ==="
          ls -la /Volumes/

      - name: Ensure System volume is RW
        run: |
          set -e
          if [ ! -d /Volumes/System ]; then
            echo "ERROR: /Volumes/System not mounted"
            diskutil list
            ls -la /Volumes/
            exit 1
          fi

          echo "=== enableownership ==="
          sudo diskutil enableownership /Volumes/System || true

          echo "=== remount RW ==="
          sudo mount -urw /Volumes/System || true

          echo "=== dyld cache dir ==="
          if [ ! -d /Volumes/System/System/Library/Caches/com.apple.dyld ]; then
            echo "ERROR: dyld dir missing on live System volume"
            echo "=== snapshots ==="
            diskutil apfs listSnapshots /Volumes/System 2>/dev/null || true
            echo "=== /Volumes/System content ==="
            ls -la /Volumes/System/
            exit 1
          fi
          ls -la /Volumes/System/System/Library/Caches/com.apple.dyld/

      - name: Patch dyld_shared_cache_arm64e
        run: |
          set -e
          PATCHER="$GITHUB_WORKSPACE/patcher/inferno_fs_patcher"
          TARGET="/Volumes/System/System/Library/Caches/com.apple.dyld/dyld_shared_cache_arm64e"

          echo "Patcher: $PATCHER"
          file "$PATCHER"
          echo "Target:  $TARGET"
          ls -lh "$TARGET"

          sudo "$PATCHER" "$TARGET"

          echo "=== Patcher done ==="

      - name: Unmount
        run: |
          sudo hdiutil detach /Volumes/System || \
            sudo hdiutil detach -force /Volumes/System || \
            echo "WARN: detach failed, continuing"

      - name: Repack result
        run: |
          set -e
          cd /tmp/megadl

          tar -czf /tmp/iphone-patched.tar.gz \
            root firmware syscfg ctrl_bits nvram sep_nvram effaceable panic_log root_ticket.der

          ls -lh /tmp/iphone-patched.tar.gz

          SIZE=$(stat -f%z /tmp/iphone-patched.tar.gz)
          echo "Repacked size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000000 ]; then
            echo "ERROR: repacked archive too small"
            exit 1
          fi

      - name: Upload as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-patched
          path: /tmp/iphone-patched.tar.gz
          retention-days: 30
          if-no-files-found: warn

      - name: Install rclone (optional MEGA upload)
        if: success()
        run: brew install rclone

      - name: Upload to MEGA via rclone (optional)
        if: success()
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -e
          if [ -z "$MEGA_EMAIL" ] || [ -z "$MEGA_PASSWORD" ]; then
            echo "MEGA secrets not set, skipping upload"
            exit 0
          fi
          OBSCURED=$(rclone obscure "$MEGA_PASSWORD")
          mkdir -p ~/.config/rclone
          printf '[mega]\ntype = mega\nuser = %s\npass = %s\n' \
            "$MEGA_EMAIL" "$OBSCURED" > ~/.config/rclone/rclone.conf
          rclone copy /tmp/iphone-patched.tar.gz mega:/
          echo "=== files on MEGA ==="
          rclone ls mega:/

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== /Volumes ==="
          ls -la /Volumes/ 2>/dev/null || true
          echo "=== diskutil list ==="
          diskutil list 2>/dev/null || true
          echo "=== /tmp/megadl ==="
          ls -la /tmp/megadl/ 2>/dev/null || true
          echo "=== patcher dir ==="
          ls -la "$GITHUB_WORKSPACE/patcher/" 2>/dev/null || true
